# hypridle: idle actions (Wayland ext-idle-notify)
# Apps that inhibit idle (video players, games, fullscreen) block these too.

general {
    ignore_dbus_inhibit = false
}

# Folding@home: fold after 10 min idle, pause on any input (see ~/.local/bin/fah-idle)
listener {
    timeout = 600
    on-timeout = ~/.local/bin/fah-idle idle
    on-resume = ~/.local/bin/fah-idle active
}
